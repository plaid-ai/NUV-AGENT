name: publish-face-artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag containing face_detector assets"
        required: true
      model_name:
        description: "Model family name"
        required: true
        default: "anomalyclip"
      model_version:
        description: "Resolved model version (e.g. v0001)"
        required: true
        default: "v0001"
      channel_pointer:
        description: "Optional model-scoped channel pointer"
        required: false
        default: "gs://nuv-model/pointers/anomalyclip/prod.json"

permissions:
  contents: read

concurrency:
  group: face-artifacts-global-publisher
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    runs-on: [self-hosted, linux, x64]
    environment: face-artifacts-release
    permissions:
      contents: read
    env:
      BUCKET: nuv-model
    steps:
      - name: Checkout allowlisted trusted publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.RELEASE_TRUSTED_PUBLISHER_SHA }}
          path: publisher
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout signed settings and executing workflow evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: settings-evidence
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/release-publish.yml
            .github/workflows/publish-face-artifacts.yml
            packaging/release/release-settings-attestation.json
            packaging/release/release-settings-attestation.json.asc

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify protected-main face publisher identity
        env:
          TRUSTED_PUBLISHER_SHA: ${{ vars.RELEASE_TRUSTED_PUBLISHER_SHA }}
          DEFAULT_BRANCH_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [[ "$TRUSTED_PUBLISHER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$WORKFLOW_SHA" = "$DEFAULT_BRANCH_SHA" ]
          [ "$(git -C publisher rev-parse HEAD)" = "$TRUSTED_PUBLISHER_SHA" ]
          [ "$(git -C settings-evidence rev-parse HEAD)" = "$WORKFLOW_SHA" ]
          [ -z "$(git -C publisher status --porcelain --untracked-files=all)" ]
          [ -z "$(git -C settings-evidence status --porcelain --untracked-files=all)" ]

      - name: Revalidate trust immediately before signed face source checkout
        env:
          TRUSTED_PUBLISHER_SHA: ${{ vars.RELEASE_TRUSTED_PUBLISHER_SHA }}
        run: |
          python3 publisher/packaging/release/verify-release-settings-attestation.py \
            --repository "$GITHUB_REPOSITORY" \
            --trusted-publisher-sha "$TRUSTED_PUBLISHER_SHA" \
            --publisher-root publisher \
            --executing-workflow settings-evidence/.github/workflows/release-publish.yml \
            --trusted-additional-workflow \
              .github/workflows/publish-face-artifacts.yml \
              settings-evidence/.github/workflows/publish-face-artifacts.yml \
            --policy publisher/packaging/release/release-security-policy.json \
            --attestation settings-evidence/packaging/release/release-settings-attestation.json \
            --signature settings-evidence/packaging/release/release-settings-attestation.json.asc \
            --signer-directory publisher/packaging/release/trusted-tag-signers

      - name: Checkout signed face release source as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          path: face-release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify allowlisted signed face release tag and component
        id: face-source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TRUSTED_PUBLISHER_SHA: ${{ vars.RELEASE_TRUSTED_PUBLISHER_SHA }}
        run: |
          set -euo pipefail
          python3 publisher/packaging/release/verify-release-source.py \
            --repository face-release-source \
            --tag "$RELEASE_TAG" \
            --origin-main-ref refs/remotes/origin/main \
            --trusted-publisher-sha "$TRUSTED_PUBLISHER_SHA" \
            --event-name "$GITHUB_EVENT_NAME" \
            --policy publisher/packaging/release/release-security-policy.json \
            --signer-directory publisher/packaging/release/trusted-tag-signers \
            --github-output "$GITHUB_OUTPUT"

      - name: Revalidate trust immediately before GitHub download credential use
        env:
          TRUSTED_PUBLISHER_SHA: ${{ vars.RELEASE_TRUSTED_PUBLISHER_SHA }}
        run: |
          python3 publisher/packaging/release/verify-release-settings-attestation.py \
            --repository "$GITHUB_REPOSITORY" \
            --trusted-publisher-sha "$TRUSTED_PUBLISHER_SHA" \
            --publisher-root publisher \
            --executing-workflow settings-evidence/.github/workflows/release-publish.yml \
            --trusted-additional-workflow \
              .github/workflows/publish-face-artifacts.yml \
              settings-evidence/.github/workflows/publish-face-artifacts.yml \
            --policy publisher/packaging/release/release-security-policy.json \
            --attestation settings-evidence/packaging/release/release-settings-attestation.json \
            --signature settings-evidence/packaging/release/release-settings-attestation.json.asc \
            --signer-directory publisher/packaging/release/trusted-tag-signers

      - name: Download exact face artifacts from immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_metadata="$(mktemp "${RUNNER_TEMP}/nuv-face-release.XXXXXX")"
          face_artifact_dir=""
          keep_face_artifact_dir=0
          cleanup_face_download() {
            rm -f -- "$release_metadata"
            if [ -n "$face_artifact_dir" ] && [ "$keep_face_artifact_dir" = 0 ]; then
              case "$face_artifact_dir" in
                "$RUNNER_TEMP"/nuv-face-artifacts.*) rm -rf -- "$face_artifact_dir" ;;
                *) echo "Refusing unexpected face artifact cleanup path" >&2 ;;
              esac
            fi
          }
          trap cleanup_face_download EXIT
          gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$release_metadata"
          python3 - "$release_metadata" "$RELEASE_TAG" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "rb") as source:
              release = json.load(source)
          expected = {
              "tag_name": sys.argv[2],
              "draft": False,
              "prerelease": False,
              "immutable": True,
          }
          if not isinstance(release, dict) or any(
              release.get(key) != value for key, value in expected.items()
          ):
              raise SystemExit("face source release is not the exact immutable final release")
          assets = release.get("assets")
          expected_assets = {
              "face_detector.onnx",
              "face_detector.plan",
              "face_detector.config.pbtxt",
              "face-artifact-manifest.json",
              "face-artifact-manifest.json.asc",
          }
          if (
              not isinstance(assets, list)
              or len(assets) != len(expected_assets)
              or {item.get("name") for item in assets if isinstance(item, dict)}
              != expected_assets
          ):
              raise SystemExit("immutable face release asset set is not exact")
          PY
          face_artifact_dir="$(mktemp -d "${RUNNER_TEMP}/nuv-face-artifacts.XXXXXX")"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$face_artifact_dir" \
            --pattern "face_detector.onnx" \
            --pattern "face_detector.plan" \
            --pattern "face_detector.config.pbtxt" \
            --pattern "face-artifact-manifest.json" \
            --pattern "face-artifact-manifest.json.asc"
          for name in \
            face_detector.onnx \
            face_detector.plan \
            face_detector.config.pbtxt \
            face-artifact-manifest.json \
            face-artifact-manifest.json.asc
          do
            [ -s "$face_artifact_dir/$name" ]
          done
          [ "$(find "$face_artifact_dir" -type f | wc -l | tr -d ' ')" = "5" ]
          echo "FACE_ARTIFACT_DIR=$face_artifact_dir" >> "$GITHUB_ENV"
          keep_face_artifact_dir=1

      - name: Verify signed face artifact manifest before any GCP credential
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMPONENT_SHA: ${{ steps.face-source.outputs.component_sha }}
          MODEL_NAME: ${{ inputs.model_name }}
          MODEL_VERSION: ${{ inputs.model_version }}
          CHANNEL_POINTER: ${{ inputs.channel_pointer }}
        run: |
          set -euo pipefail
          python3 publisher/packaging/release/face-artifact-manifest.py verify \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --component-sha "$COMPONENT_SHA" \
            --model-name "$MODEL_NAME" \
            --model-version "$MODEL_VERSION" \
            --channel-pointer "$CHANNEL_POINTER" \
            --artifact-directory "$FACE_ARTIFACT_DIR" \
            --manifest "$FACE_ARTIFACT_DIR/face-artifact-manifest.json" \
            --signature "$FACE_ARTIFACT_DIR/face-artifact-manifest.json.asc" \
            --policy publisher/packaging/release/release-security-policy.json \
            --signer-directory publisher/packaging/release/trusted-tag-signers

      - name: Revalidate trust immediately before face GCP authentication
        env:
          TRUSTED_PUBLISHER_SHA: ${{ vars.RELEASE_TRUSTED_PUBLISHER_SHA }}
        run: |
          python3 publisher/packaging/release/verify-release-settings-attestation.py \
            --repository "$GITHUB_REPOSITORY" \
            --trusted-publisher-sha "$TRUSTED_PUBLISHER_SHA" \
            --publisher-root publisher \
            --executing-workflow settings-evidence/.github/workflows/release-publish.yml \
            --trusted-additional-workflow \
              .github/workflows/publish-face-artifacts.yml \
              settings-evidence/.github/workflows/publish-face-artifacts.yml \
            --policy publisher/packaging/release/release-security-policy.json \
            --attestation settings-evidence/packaging/release/release-settings-attestation.json \
            --signature settings-evidence/packaging/release/release-settings-attestation.json.asc \
            --signer-directory publisher/packaging/release/trusted-tag-signers

      - name: Authenticate face-artifact-only GCP publisher
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Revalidate trust immediately before GCP project secret use
        env:
          TRUSTED_PUBLISHER_SHA: ${{ vars.RELEASE_TRUSTED_PUBLISHER_SHA }}
        run: |
          python3 publisher/packaging/release/verify-release-settings-attestation.py \
            --repository "$GITHUB_REPOSITORY" \
            --trusted-publisher-sha "$TRUSTED_PUBLISHER_SHA" \
            --publisher-root publisher \
            --executing-workflow settings-evidence/.github/workflows/release-publish.yml \
            --trusted-additional-workflow \
              .github/workflows/publish-face-artifacts.yml \
              settings-evidence/.github/workflows/publish-face-artifacts.yml \
            --policy publisher/packaging/release/release-security-policy.json \
            --attestation settings-evidence/packaging/release/release-settings-attestation.json \
            --signature settings-evidence/packaging/release/release-settings-attestation.json.asc \
            --signer-directory publisher/packaging/release/trusted-tag-signers

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Revalidate trust immediately before GCS credential use
        env:
          TRUSTED_PUBLISHER_SHA: ${{ vars.RELEASE_TRUSTED_PUBLISHER_SHA }}
        run: |
          python3 publisher/packaging/release/verify-release-settings-attestation.py \
            --repository "$GITHUB_REPOSITORY" \
            --trusted-publisher-sha "$TRUSTED_PUBLISHER_SHA" \
            --publisher-root publisher \
            --executing-workflow settings-evidence/.github/workflows/release-publish.yml \
            --trusted-additional-workflow \
              .github/workflows/publish-face-artifacts.yml \
              settings-evidence/.github/workflows/publish-face-artifacts.yml \
            --policy publisher/packaging/release/release-security-policy.json \
            --attestation settings-evidence/packaging/release/release-settings-attestation.json \
            --signature settings-evidence/packaging/release/release-settings-attestation.json.asc \
            --signer-directory publisher/packaging/release/trusted-tag-signers

      - name: Publish to model-scoped GCS paths and update pointers
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMPONENT_SHA: ${{ steps.face-source.outputs.component_sha }}
          MODEL_NAME: ${{ inputs.model_name }}
          MODEL_VERSION: ${{ inputs.model_version }}
          CHANNEL_POINTER: ${{ inputs.channel_pointer }}
        run: |
          set -euo pipefail
          [[ "$MODEL_NAME" =~ ^[a-z0-9][a-z0-9_-]{0,63}$ ]]
          [[ "$MODEL_VERSION" =~ ^v[0-9]{4,}$ ]]
          if [ -n "$CHANNEL_POINTER" ]; then
            [[ "$CHANNEL_POINTER" == "gs://${BUCKET}/pointers/${MODEL_NAME}/"*.json ]]
          fi
          python3 publisher/packaging/release/face-artifact-manifest.py verify \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --component-sha "$COMPONENT_SHA" \
            --model-name "$MODEL_NAME" \
            --model-version "$MODEL_VERSION" \
            --channel-pointer "$CHANNEL_POINTER" \
            --artifact-directory "$FACE_ARTIFACT_DIR" \
            --manifest "$FACE_ARTIFACT_DIR/face-artifact-manifest.json" \
            --signature "$FACE_ARTIFACT_DIR/face-artifact-manifest.json.asc" \
            --policy publisher/packaging/release/release-security-policy.json \
            --signer-directory publisher/packaging/release/trusted-tag-signers
          python3 publisher/packaging/release/publish-model-artifacts.py \
            --bucket "$BUCKET" \
            --model-name "$MODEL_NAME" \
            --version "$MODEL_VERSION" \
            --version-pointer "gs://${BUCKET}/nuvion/${MODEL_NAME}/${MODEL_VERSION}/pointer.json" \
            --channel-pointer "$CHANNEL_POINTER" \
            --face-onnx "$FACE_ARTIFACT_DIR/face_detector.onnx" \
            --face-plan "$FACE_ARTIFACT_DIR/face_detector.plan" \
            --face-triton-config "$FACE_ARTIFACT_DIR/face_detector.config.pbtxt"

      - name: Remove downloaded face artifacts on every exit path
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${FACE_ARTIFACT_DIR:-}" ]; then
            case "$FACE_ARTIFACT_DIR" in
              "$RUNNER_TEMP"/nuv-face-artifacts.*) ;;
              *) echo "Refusing unexpected face artifact cleanup path" >&2; exit 1 ;;
            esac
            chmod -R u+rwX "$FACE_ARTIFACT_DIR" 2>/dev/null || true
            rm -rf -- "$FACE_ARTIFACT_DIR"
          fi
