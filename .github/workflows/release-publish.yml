name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_meta.outputs.tag }}
      release_version: ${{ steps.release_meta.outputs.version }}
      component_sha: ${{ steps.release_meta.outputs.component_sha }}
    permissions:
      contents: write
    env:
      TAP_REPO: plaid-ai/homebrew-NUV-agent-homebrew
      FORMULA_PATH: Formula/nuv-agent.rb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve and verify release identity
        id: release_meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="${REQUESTED_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          COMPONENT_SHA=$(git rev-parse HEAD)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "component_sha=$COMPONENT_SHA" >> $GITHUB_OUTPUT
          python packaging/release/stamp-build-info.py --sha "$COMPONENT_SHA" --version "$VERSION"

      - name: Test source in clean environment
        env:
          NUV_AGENT_CONFIG: ${{ runner.temp }}/nuv-agent-release-test-${{ github.run_id }}-${{ github.run_attempt }}.env
        run: |
          python -m venv .release-test-venv
          .release-test-venv/bin/python -m pip install --upgrade pip
          .release-test-venv/bin/python -m pip install .
          .release-test-venv/bin/python -m unittest discover -s tests -p 'test_*.py'

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist
          ls -la dist

      - name: Install and smoke-test built sdist
        env:
          NUV_AGENT_CONFIG: ${{ runner.temp }}/nuv-agent-release-test-${{ github.run_id }}-${{ github.run_attempt }}.env
        run: |
          TARBALL="dist/nuv_agent-${{ steps.release_meta.outputs.version }}.tar.gz"
          python -m venv .release-smoke-venv
          .release-smoke-venv/bin/python -m pip install --upgrade pip
          .release-smoke-venv/bin/python -m pip install --no-cache-dir "$TARBALL"
          .release-smoke-venv/bin/python -c "from nuvion_app import build_info; assert build_info.AGENT_VERSION == '${{ steps.release_meta.outputs.version }}'; assert build_info.COMPONENT_SHA == '${{ steps.release_meta.outputs.component_sha }}'"
          .release-smoke-venv/bin/nuv-agent --help >/dev/null

      - name: Compute SHA256
        id: sha
        run: |
          TARBALL="dist/nuv_agent-${{ steps.release_meta.outputs.version }}.tar.gz"
          SHA=$(python -c "import hashlib, pathlib; p=pathlib.Path('$TARBALL'); print(hashlib.sha256(p.read_bytes()).hexdigest())")
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "tag=${{ steps.release_meta.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "version=${{ steps.release_meta.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sha.outputs.tag }}
          files: ${{ steps.sha.outputs.tarball }}

      - name: Update Homebrew tap
        if: env.TAP_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.sha.outputs.version }}
          URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.sha.outputs.tag }}/nuv_agent-${{ steps.sha.outputs.version }}.tar.gz
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set" >&2
            exit 1
          fi
          git clone https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git tap
          cp packaging/homebrew/nuv-agent.rb "tap/$FORMULA_PATH"
          FORMULA_PATH=tap/$FORMULA_PATH URL=$URL SHA256=$SHA256 VERSION=$VERSION \
            ./packaging/release/update-homebrew-formula.sh
          cd tap
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git
          git config user.email "release-bot@plaidai.io"
          git config user.name "release-bot"
          git add "$FORMULA_PATH"
          git commit -m "Update nuv-agent ${VERSION#v}"
          git push origin HEAD

  apt-publish:
    name: Publish APT repo
    runs-on: ubuntu-24.04-arm
    needs: release
    permissions:
      contents: read
    env:
      GNUPGHOME: ${{ github.workspace }}/.gnupg
      GPG_KEY_ID: E5230C3090A66BC5
      BUCKET: apt.plaidai.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Stamp build identity
        env:
          COMPONENT_SHA: ${{ needs.release.outputs.component_sha }}
          VERSION: ${{ needs.release.outputs.release_version }}
        run: python3 packaging/release/stamp-build-info.py --sha "$COMPONENT_SHA" --version "$VERSION"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-venv python3-pip aptly gnupg

      - name: Verify arm64 runner
        run: |
          ARCH=$(dpkg --print-architecture)
          if [ "$ARCH" != "arm64" ]; then
            echo "Runner architecture must be arm64, got $ARCH" >&2
            exit 1
          fi

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "APT_GPG_PRIVATE_KEY secret not set" >&2
            exit 1
          fi
          if [ -z "$GPG_PASSPHRASE" ]; then
            echo "APT_GPG_PASSPHRASE secret not set" >&2
            exit 1
          fi
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "test" | gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$GPG_KEY_ID" --sign >/dev/null

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd packaging/deb
          ./build-deb.sh

      - name: Publish to APT (GCS)
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          DEB_PATH="dist/nuv-agent_${{ steps.version.outputs.version }}_arm64.deb"
          if [ ! -f "$DEB_PATH" ]; then
            echo "Deb not found at $DEB_PATH" >&2
            ls -la dist || true
            exit 1
          fi
          packaging/apt/publish-gcs.sh "$DEB_PATH"
