name: agent-release-gate

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arm64-release-prerequisite:
    name: arm64-release-prerequisite
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup bundle Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prove native arm64 runner and locked bundle resolution
        run: |
          set -euo pipefail
          [ "$(dpkg --print-architecture)" = "arm64" ]
          python -m venv "${RUNNER_TEMP}/arm64-release-prerequisite"
          "${RUNNER_TEMP}/arm64-release-prerequisite/bin/python" -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r packaging/release/requirements-agent-bundle-arm64.txt
          "${RUNNER_TEMP}/arm64-release-prerequisite/bin/python" - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.machine() in {"aarch64", "arm64"}
          assert version("cryptography") == "50.0.0"
          assert version("setuptools") == "83.0.0"
          assert version("wheel") == "0.46.2"
          PY

  macos-cpu-reference:
    name: macos-cpu-reference
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      reference-sha256: ${{ steps.reference.outputs.sha256 }}
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup exact oracle Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install the exact inference tuple
        env:
          ORACLE_VENV: ${{ runner.temp }}/siglip-cpu-oracle
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "arm64" ]
          python -c 'import sys; assert sys.version_info[:2] == (3, 14)'
          python -m venv "$ORACLE_VENV"
          "$ORACLE_VENV/bin/python" -m pip install '.[zsad]'
          "$ORACLE_VENV/bin/python" - <<'PY'
          import platform
          import sys
          from importlib.metadata import version
          expected = {
              "torch": "2.10.0",
              "numpy": "2.4.2",
              "Pillow": "12.1.0",
              "transformers": "5.16.1",
              "huggingface-hub": "1.29.0",
              "hf-xet": "1.6.0",
              "tokenizers": "0.23.1",
              "safetensors": "0.8.0",
              "sentencepiece": "0.2.2",
              "protobuf": "7.36.1",
          }
          assert platform.machine() == "arm64"
          assert sys.version_info[:2] == (3, 14)
          assert {name: version(name) for name in expected} == expected
          PY

      - name: Download only the reviewed SigLIP snapshot revision
        id: model
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          MODEL_REVISION: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
          ORACLE_VENV: ${{ runner.temp }}/siglip-cpu-oracle
        run: |
          set -euo pipefail
          MODEL_PATH=$("$ORACLE_VENV/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          revision = os.environ["MODEL_REVISION"]
          path = Path(snapshot_download(
              repo_id="google/siglip2-base-patch16-224",
              revision=revision,
          )).resolve()
          if path.name != revision:
              raise SystemExit("resolved model snapshot revision differs")
          print(path)
          PY
          )
          echo "path=$MODEL_PATH" >> "$GITHUB_OUTPUT"

      - name: Compute strict CPU reference
        id: reference
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          MODEL_PATH: ${{ steps.model.outputs.path }}
          MODEL_REVISION: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
          ORACLE_VENV: ${{ runner.temp }}/siglip-cpu-oracle
          REFERENCE_DIR: ${{ runner.temp }}/siglip-cpu-reference
        run: |
          set -euo pipefail
          install -d -m 0700 "$REFERENCE_DIR"
          REFERENCE_PATH="$REFERENCE_DIR/siglip-reference-v1.json"
          export REFERENCE_PATH
          PYTHONNOUSERSITE=1 "$ORACLE_VENV/bin/python" -I - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          import numpy as np
          import torch
          from huggingface_hub import snapshot_download
          from transformers import AutoModel, AutoProcessor
          import nuvion_app
          path = Path(os.environ["MODEL_PATH"]).resolve()
          revision = os.environ["MODEL_REVISION"]
          oracle_venv = Path(os.environ["ORACLE_VENV"]).resolve()
          reference_path = Path(os.environ["REFERENCE_PATH"])
          package_path = Path(nuvion_app.__file__).resolve()
          assert package_path.is_relative_to(oracle_venv)
          assert reference_path.parent.resolve() == Path(os.environ["REFERENCE_DIR"]).resolve()
          assert path.name == revision
          assert Path(snapshot_download(
              repo_id="google/siglip2-base-patch16-224",
              revision=revision,
              local_files_only=True,
          )).resolve() == path
          labels = ["normal scene", "anomalous scene"]
          texts = [f"This is a photo of {label}." for label in labels]
          frame = np.zeros((224, 224, 3), dtype=np.uint8)

          reference_model = AutoModel.from_pretrained(
              str(path), dtype=torch.float16, low_cpu_mem_usage=True
          ).eval()
          reference_processor = AutoProcessor.from_pretrained(str(path))
          reference_inputs = reference_processor(
              text=texts,
              images=frame,
              padding="max_length",
              max_length=64,
              return_tensors="pt",
          )
          reference_inputs = {
              key: value.to(dtype=torch.float16)
              if value.is_floating_point()
              else value
              for key, value in reference_inputs.items()
          }
          with torch.inference_mode():
              reference_outputs = reference_model(**reference_inputs)
          reference_scores = torch.sigmoid(
              reference_outputs.logits_per_image
          ).squeeze(0).float()
          scores = [float(score) for score in reference_scores]
          assert len(scores) == len(labels) and all(math.isfinite(score) for score in scores)
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          if hasattr(os, "O_NOFOLLOW"):
              flags |= os.O_NOFOLLOW
          descriptor = os.open(reference_path, flags, 0o600)
          with os.fdopen(descriptor, "w", encoding="utf-8") as output:
              json.dump(
                  {
                      "schemaVersion": 1,
                      "modelRevision": revision,
                      "labels": labels,
                      "scores": scores,
                  },
                  output,
                  sort_keys=True,
                  separators=(",", ":"),
              )
              output.flush()
              os.fsync(output.fileno())
          PY
          [ -f "$REFERENCE_PATH" ]
          [ ! -L "$REFERENCE_PATH" ]
          [ "$(wc -c < "$REFERENCE_PATH" | tr -d ' ')" -le 4096 ]
          echo "sha256=$(shasum -a 256 "$REFERENCE_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Transfer strict CPU reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: siglip-cpu-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/siglip-cpu-reference/siglip-reference-v1.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  macos-arm64-release-prerequisite:
    name: macos-arm64-release-prerequisite
    runs-on: macos-14-xlarge
    needs: macos-cpu-reference
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup exact formula Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Build exact local sdist and formula
        env:
          BUILD_VENV: ${{ runner.temp }}/nuv-agent-formula-build
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "arm64" ]
          python -c 'import sys; assert sys.version_info[:2] == (3, 14)'
          python -m venv "$BUILD_VENV"
          "$BUILD_VENV/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r packaging/release/requirements-release-build.txt
          "$BUILD_VENV/bin/python" -m build --sdist --no-isolation --outdir dist
          VERSION=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SDIST="dist/nuv_agent-${VERSION}.tar.gz"
          [ -s "$SDIST" ]
          cp packaging/homebrew/nuv-agent.rb "${RUNNER_TEMP}/nuv-agent.rb"
          FORMULA_PATH="${RUNNER_TEMP}/nuv-agent.rb" \
          URL="file://${GITHUB_WORKSPACE}/${SDIST}" \
          SHA256="$(shasum -a 256 "$SDIST" | awk '{print $1}')" \
          VERSION="$VERSION" \
            packaging/release/update-homebrew-formula.sh

      - name: Install the exact shipped Homebrew tuple
        run: |
          set -euo pipefail
          TAP_NAME="nuvion/release-gate"
          FORMULA_NAME="$TAP_NAME/nuv-agent"
          brew tap-new --no-git "$TAP_NAME"
          TAP_ROOT="$(brew --repository "$TAP_NAME")"
          install -m 0644 \
            "${RUNNER_TEMP}/nuv-agent.rb" \
            "$TAP_ROOT/Formula/nuv-agent.rb"
          # Homebrew 6 rejects path formulae and requires explicit trust for
          # non-official taps. Trust only this exact candidate formula.
          brew trust --formula "$FORMULA_NAME"
          brew install --formula --build-from-source "$FORMULA_NAME"
          FORMULA_PYTHON="$(brew --prefix nuv-agent)/libexec/bin/python"
          [ -x "$FORMULA_PYTHON" ]
          "$FORMULA_PYTHON" -m pip check
          "$FORMULA_PYTHON" - <<'PY'
          import platform
          import sys
          from importlib.metadata import version
          expected = {
              "torch": "2.10.0",
              "numpy": "2.4.2",
              "Pillow": "12.1.0",
              "transformers": "5.16.1",
              "huggingface-hub": "1.29.0",
              "hf-xet": "1.6.0",
              "tokenizers": "0.23.1",
              "safetensors": "0.8.0",
              "sentencepiece": "0.2.2",
              "protobuf": "7.36.1",
          }
          assert platform.machine() == "arm64"
          assert sys.version_info[:2] == (3, 14)
          assert {name: version(name) for name in expected} == expected
          PY

      - name: Download only the reviewed SigLIP snapshot revision
        id: model
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          MODEL_REVISION: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
        run: |
          set -euo pipefail
          FORMULA_PYTHON="$(brew --prefix nuv-agent)/libexec/bin/python"
          MODEL_PATH=$("$FORMULA_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          revision = os.environ["MODEL_REVISION"]
          path = Path(snapshot_download(
              repo_id="google/siglip2-base-patch16-224",
              revision=revision,
          )).resolve()
          if path.name != revision:
              raise SystemExit("resolved model snapshot revision differs")
          print(path)
          PY
          )
          echo "path=$MODEL_PATH" >> "$GITHUB_OUTPUT"

      - name: Download strict CPU reference from the fresh runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: siglip-cpu-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/siglip-cpu-reference

      - name: Prove offline MPS inference with the exact shipped tuple
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          MODEL_PATH: ${{ steps.model.outputs.path }}
          MODEL_REVISION: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
          REFERENCE_PATH: ${{ runner.temp }}/siglip-cpu-reference/siglip-reference-v1.json
          REFERENCE_SHA256: ${{ needs.macos-cpu-reference.outputs.reference-sha256 }}
        run: |
          set -euo pipefail
          # Reclaim the large filesystem cache left by the Formula install
          # before allocating from the same unified-memory pool.
          sync
          sudo purge
          FORMULA_PREFIX="$(brew --prefix nuv-agent)"
          FORMULA_PYTHON="$FORMULA_PREFIX/libexec/bin/python"
          export FORMULA_PREFIX
          [ -f "$REFERENCE_PATH" ]
          [ ! -L "$REFERENCE_PATH" ]
          [ "$(wc -c < "$REFERENCE_PATH" | tr -d ' ')" -le 4096 ]
          [[ "$REFERENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(shasum -a 256 "$REFERENCE_PATH" | awk '{print $1}')" = "$REFERENCE_SHA256" ]
          chmod 0600 "$REFERENCE_PATH"
          cd "$RUNNER_TEMP"
          # GitHub's 8 GiB image can trip PyTorch's conservative dynamic
          # watermark after Formula/model file I/O. This is scoped to the
          # ephemeral proof process; parity and strict active/driver/delta
          # bounds below still reject actual MPS over-allocation or growth.
          PYTORCH_MPS_HIGH_WATERMARK_RATIO=0.0 \
            PYTHONNOUSERSITE=1 "$FORMULA_PYTHON" -I - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          import stat
          import subprocess
          import numpy as np
          import torch
          from huggingface_hub import snapshot_download
          import nuvion_app
          from nuvion_app.inference.zero_shot import ZeroShotAnomalyDetector
          path = Path(os.environ["MODEL_PATH"]).resolve()
          revision = os.environ["MODEL_REVISION"]
          formula_prefix = Path(os.environ["FORMULA_PREFIX"]).resolve()
          reference_path = Path(os.environ["REFERENCE_PATH"])
          package_path = Path(nuvion_app.__file__).resolve()
          assert os.environ["PYTORCH_MPS_HIGH_WATERMARK_RATIO"] == "0.0"
          assert package_path.is_relative_to(formula_prefix / "libexec")
          assert torch.backends.mps.is_available()
          assert path.name == revision
          assert Path(snapshot_download(
              repo_id="google/siglip2-base-patch16-224",
              revision=revision,
              local_files_only=True,
          )).resolve() == path
          reference_stat = reference_path.lstat()
          assert stat.S_ISREG(reference_stat.st_mode)
          assert stat.S_IMODE(reference_stat.st_mode) == 0o600
          reference = json.loads(reference_path.read_text(encoding="utf-8"))
          assert set(reference) == {
              "schemaVersion", "modelRevision", "labels", "scores"
          }
          labels = ["normal scene", "anomalous scene"]
          frame = np.zeros((224, 224, 3), dtype=np.uint8)
          assert type(reference["schemaVersion"]) is int
          assert reference["schemaVersion"] == 1
          assert reference["modelRevision"] == revision
          assert reference["labels"] == labels
          scores = reference["scores"]
          assert isinstance(scores, list) and len(scores) == len(labels)
          assert all(
              isinstance(score, (int, float))
              and not isinstance(score, bool)
              and math.isfinite(score)
              and 0.0 <= score <= 1.0
              for score in scores
          )
          reference_scores = torch.tensor(scores, dtype=torch.float32)

          detector = ZeroShotAnomalyDetector(
              enabled=True,
              model_name=str(path),
              labels=labels,
              anomaly_labels=["anomalous scene"],
              threshold=0.5,
              device_preference="mps",
          )
          assert detector.ready and detector._device == "mps"
          assert detector._inference_dtype == torch.float16
          assert detector._model.__class__.__name__ == "SiglipVisionModel"
          assert not hasattr(detector._model, "text_model")
          vision_root = getattr(detector._model, "vision_model", detector._model)
          vision_parameters = tuple(vision_root.parameters())
          assert vision_parameters
          assert {parameter.device.type for parameter in vision_parameters} == {"mps"}
          assert {parameter.dtype for parameter in vision_parameters} == {torch.float16}
          assert detector._mps_text_features.device.type == "mps"
          assert detector._mps_text_features.dtype == torch.float16
          assert detector._mps_text_features._base is detector._mps_persistent_state
          assert detector._mps_logit_scale._base is detector._mps_persistent_state
          assert detector._mps_logit_bias._base is detector._mps_persistent_state
          assert detector._mps_persistent_state.numel() == (
              detector._mps_text_features.numel() + 2
          )
          for scalar in (detector._mps_logit_scale, detector._mps_logit_bias):
              assert scalar.device.type == "mps" and scalar.dtype == torch.float16

          # The 8 GiB hosted runner has one unified CPU/GPU pool. Reclaim
          # checkpoint/import pages after the real model is resident and before
          # the first MPS graph allocates its shared command buffers. This is
          # proof-process hygiene only; no production environment is changed.
          torch.mps.synchronize()
          subprocess.run(["sync"], check=True)
          subprocess.run(["sudo", "purge"], check=True)

          result = detector.classify(frame)
          assert result is not None and len(result["scores"]) == 2
          observed = {
              label: score for label, score in zip(result["labels"], result["scores"])
          }
          observed_scores = torch.tensor([observed[label] for label in labels])
          assert torch.allclose(
              observed_scores, reference_scores, rtol=5e-2, atol=1e-5
          )
          torch.mps.synchronize()
          stable_bytes = torch.mps.current_allocated_memory()
          for _ in range(16):
              repeated = detector.classify(frame)
              assert repeated is not None and len(repeated["scores"]) == 2
          torch.mps.synchronize()
          assert torch.mps.current_allocated_memory() <= stable_bytes + 16 * 1024**2
          assert torch.mps.current_allocated_memory() < 512 * 1024**2
          assert torch.mps.driver_allocated_memory() < 1024 * 1024**2
          PY

      - name: Remove the ephemeral candidate tap
        if: always()
        run: |
          brew uninstall --force nuvion/release-gate/nuv-agent >/dev/null 2>&1 || true
          brew untrust --formula nuvion/release-gate/nuv-agent >/dev/null 2>&1 || true
          brew untap nuvion/release-gate >/dev/null 2>&1 || true

  agent-release-gate:
    name: agent-release-gate
    runs-on: ubuntu-latest
    needs: [arm64-release-prerequisite, macos-cpu-reference, macos-arm64-release-prerequisite]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Enforce arm64 prerequisite result
        env:
          ARM64_RESULT: ${{ needs.arm64-release-prerequisite.result }}
          CPU_REFERENCE_RESULT: ${{ needs.macos-cpu-reference.result }}
          MACOS_RESULT: ${{ needs.macos-arm64-release-prerequisite.result }}
        run: |
          [ "$ARM64_RESULT" = "success" ] \
            || { echo "arm64 release prerequisite did not succeed" >&2; exit 1; }
          [ "$CPU_REFERENCE_RESULT" = "success" ] \
            || { echo "macOS CPU reference prerequisite did not succeed" >&2; exit 1; }
          [ "$MACOS_RESULT" = "success" ] \
            || { echo "macOS arm64 release prerequisite did not succeed" >&2; exit 1; }

      - name: Checkout candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test and shell runtimes
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install \
            transformers==5.16.1 huggingface-hub==1.29.0 hf-xet==1.6.0 \
            tokenizers==0.23.1 safetensors==0.8.0
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$archive"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" \
            | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/actionlint"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/actionlint" actionlint
          shellcheck_archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$shellcheck_archive"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $shellcheck_archive" \
            | sha256sum --check --strict
          tar -xJf "$shellcheck_archive" -C "${RUNNER_TEMP}"

      - name: Validate workflows and release shell
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint/actionlint" -color=false
          "${RUNNER_TEMP}/shellcheck-v0.11.0/shellcheck" \
            packaging/apt/publish-gcs.sh \
            packaging/release/publish-immutable-gcs-file.sh
          bash -n \
            packaging/apt/publish-gcs.sh \
            packaging/release/publish-immutable-gcs-file.sh

      - name: Run isolated Agent suite
        env:
          NUV_AGENT_CONFIG: ${{ runner.temp }}/agent-release-gate-${{ github.run_id }}.env
        run: python packaging/release/run-isolated-tests.py
