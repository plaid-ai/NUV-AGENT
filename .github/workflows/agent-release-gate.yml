name: agent-release-gate

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe-standalone-oidc-identity:
    name: Observe non-secret standalone OIDC identity metadata
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      id-token: write
    steps:
      - name: Observe only workflow identity fields without credentials or artifacts
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          parsed = urllib.parse.urlsplit(endpoint)
          if parsed.scheme != 'https' or parsed.username or parsed.password:
              raise SystemExit('OIDC endpoint must be HTTPS')
          separator = '&' if parsed.query else '?'
          audience = 'nuvion-iq9075-identity-observation'
          request = urllib.request.Request(
              endpoint + separator + urllib.parse.urlencode({'audience': audience}),
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = json.load(response)['value']
              pieces = value.split('.')
              if len(pieces) != 3:
                  raise ValueError('JWT shape')
              claims = json.loads(base64.urlsafe_b64decode(pieces[1] + '=' * (-len(pieces[1]) % 4)))
          except (KeyError, ValueError, urllib.error.URLError):
              raise SystemExit('OIDC metadata observation failed; token not logged') from None
          fields = ('workflow_ref', 'workflow_sha', 'job_workflow_ref', 'job_workflow_sha', 'ref', 'ref_type', 'event_name')
          observed = {key: claims[key] for key in fields if key in claims}
          print(json.dumps({'kind': 'non-authorizing-oidc-metadata-observation', 'claims': observed,
                            'expectedWorkflowRef': os.environ['EXPECTED_WORKFLOW_REF'],
                            'expectedWorkflowSha': os.environ['EXPECTED_WORKFLOW_SHA']}, sort_keys=True))
          # This is diagnostic metadata only. It never authorizes a release,
          # uploads a JWT, enters a protected Environment, or reads a secret.
          PY
      - name: Check publisher Ed25519 runtime without release material
        run: |
          command -v python3
          python3 - <<'PY'
          import cryptography
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.generate()
          key.public_key().verify(key.sign(b'publisher-runtime-probe'), b'publisher-runtime-probe')
          print('Ed25519 round-trip PASS; cryptography=' + cryptography.__version__)
          PY

  arm64-release-prerequisite:
    name: arm64-release-prerequisite
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup bundle Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prove native arm64 runner and locked bundle resolution
        run: |
          set -euo pipefail
          [ "$(dpkg --print-architecture)" = "arm64" ]
          python -m venv "${RUNNER_TEMP}/arm64-release-prerequisite"
          "${RUNNER_TEMP}/arm64-release-prerequisite/bin/python" -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r packaging/release/requirements-agent-bundle-arm64.txt
          "${RUNNER_TEMP}/arm64-release-prerequisite/bin/python" - <<'PY'
          import platform
          from importlib.metadata import version
          assert platform.machine() in {"aarch64", "arm64"}
          assert version("cryptography") == "50.0.0"
          assert version("setuptools") == "83.0.0"
          assert version("wheel") == "0.46.2"
          PY

  agent-release-gate:
    name: agent-release-gate
    runs-on: ubuntu-latest
    needs: [arm64-release-prerequisite]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Enforce arm64 prerequisite result
        env:
          ARM64_RESULT: ${{ needs.arm64-release-prerequisite.result }}
        run: |
          [ "$ARM64_RESULT" = "success" ] \
            || { echo "arm64 release prerequisite did not succeed" >&2; exit 1; }

      - name: Checkout candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Stamp exact checked-out candidate identity
        run: |
          set -euo pipefail
          [ -z "$(git status --porcelain --untracked-files=all)" ]
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          CANDIDATE_VERSION="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python packaging/release/stamp-build-info.py \
            --sha "$CANDIDATE_SHA" --version "$CANDIDATE_VERSION"
          [ "$(git status --porcelain --untracked-files=all)" = " M nuvion_app/build_info.py" ]
          {
            echo "CANDIDATE_SHA=$CANDIDATE_SHA"
            echo "CANDIDATE_VERSION=$CANDIDATE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Install test and shell runtimes
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install \
            transformers==5.16.1 huggingface-hub==1.29.0 hf-xet==1.6.0 \
            tokenizers==0.23.1 safetensors==0.8.0
          cd "$RUNNER_TEMP"
          PYTHONNOUSERSITE=1 python -I - <<'PY'
          import os
          import sys
          from pathlib import Path
          import nuvion_app
          from nuvion_app import build_info
          package_path = Path(nuvion_app.__file__).resolve()
          assert package_path.is_relative_to(Path(sys.prefix).resolve())
          assert not package_path.is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve())
          assert build_info.AGENT_VERSION == os.environ["CANDIDATE_VERSION"]
          assert build_info.COMPONENT_SHA == os.environ["CANDIDATE_SHA"]
          PY
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$archive"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" \
            | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/actionlint"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/actionlint" actionlint
          shellcheck_archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$shellcheck_archive"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $shellcheck_archive" \
            | sha256sum --check --strict
          tar -xJf "$shellcheck_archive" -C "${RUNNER_TEMP}"

      - name: Validate workflows and release shell
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint/actionlint" -color=false
          "${RUNNER_TEMP}/shellcheck-v0.11.0/shellcheck" \
            packaging/apt/publish-gcs.sh \
            packaging/release/publish-immutable-gcs-file.sh
          bash -n \
            packaging/apt/publish-gcs.sh \
            packaging/release/publish-immutable-gcs-file.sh

      - name: Run isolated Agent suite
        env:
          NUV_AGENT_CONFIG: ${{ runner.temp }}/agent-release-gate-${{ github.run_id }}.env
        run: python packaging/release/run-isolated-tests.py
