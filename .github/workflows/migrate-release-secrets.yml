name: Migrate release secrets once

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MIGRATE_AND_DELETE_FORBIDDEN_REPOSITORY_SECRETS"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuv-agent-release-secret-migration
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  migrate:
    name: Verify identity and copy two missing secrets
    if: >-
      github.repository == 'plaid-ai/NUV-AGENT' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'MIGRATE_AND_DELETE_FORBIDDEN_REPOSITORY_SECRETS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-secret-migration
    steps:
      - name: Check out exact protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify protected-main and Platform-Admin identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SECRET_MIGRATION_ADMIN_TOKEN }}
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "migration administrator credential unavailable" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -z "$(git status --porcelain --untracked-files=all)" ]
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [ "$GITHUB_SHA" = "$main_sha" ] \
            || { echo "execution SHA is not the current main revision" >&2; exit 1; }
          [ "$EXECUTING_WORKFLOW_SHA" = "$main_sha" ] \
            || { echo "workflow definition is not the current main revision" >&2; exit 1; }
          protected="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .protected)"
          [ "$protected" = true ] \
            || { echo "main is not protected" >&2; exit 1; }
          token_login="$(gh api user --jq .login)"
          [ "$token_login" = "$GITHUB_ACTOR" ] \
            || { echo "administrator token does not belong to workflow actor" >&2; exit 1; }
          permission="$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission)"
          [ "$permission" = admin ] \
            || { echo "workflow actor is not a repository administrator" >&2; exit 1; }
          team_id="$(jq -er .releaseAdminTeamId packaging/release/release-security-policy.json)"
          membership="$(gh api "teams/${team_id}/memberships/${GITHUB_ACTOR}" \
            --jq '[.state,.role] | @tsv')"
          case "$membership" in
            $'active\tmember'|$'active\tmaintainer') ;;
            *) echo "workflow actor is not an active Platform-Admin member" >&2; exit 1 ;;
          esac

      - name: Verify all forbidden repository secret names exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SECRET_MIGRATION_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          actual="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/secrets?per_page=100" \
            --jq '.secrets[].name' | LC_ALL=C sort)"
          mapfile -t forbidden < <(jq -er '.forbiddenRepositorySecrets[]' \
            packaging/release/release-security-policy.json)
          [ "${#forbidden[@]}" -eq 8 ] \
            || { echo "forbidden repository-secret policy is not the expected one-shot set" >&2; exit 1; }
          for name in "${forbidden[@]}"; do
            grep -Fxq "$name" <<<"$actual" \
              || { echo "required repository-secret metadata is missing" >&2; exit 1; }
          done

      - name: Verify source authorization and signing identity
        shell: bash
        env:
          SOURCE_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SOURCE_IQ_SIGNING_PRIVATE_KEY: ${{ secrets.IQ9075_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SOURCE_HOMEBREW_TAP_TOKEN" ] \
            || { echo "Homebrew source credential unavailable" >&2; exit 1; }
          can_push="$(GH_TOKEN="$SOURCE_HOMEBREW_TAP_TOKEN" \
            gh api repos/plaid-ai/NUV-agent-homebrew --jq '.permissions.push')"
          [ "$can_push" = true ] \
            || { echo "Homebrew source credential lacks target push access" >&2; exit 1; }
          python3 packaging/release/verify-secret-migration-material.py iq-key \
            --private-key-env SOURCE_IQ_SIGNING_PRIVATE_KEY \
            --policy packaging/release/release-security-policy.json

      - name: Copy source values to exact target environments via stdin
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SECRET_MIGRATION_ADMIN_TOKEN }}
          SOURCE_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SOURCE_IQ_SIGNING_PRIVATE_KEY: ${{ secrets.IQ9075_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SOURCE_HOMEBREW_TAP_TOKEN" ] && [ -n "$SOURCE_IQ_SIGNING_PRIVATE_KEY" ]
          printf '%s' "$SOURCE_HOMEBREW_TAP_TOKEN" \
            | gh secret set HOMEBREW_TAP_TOKEN \
                --repo "$GITHUB_REPOSITORY" --env homebrew-release --app actions >/dev/null
          printf '%s' "$SOURCE_IQ_SIGNING_PRIVATE_KEY" \
            | gh secret set IQ9075_RELEASE_SIGNING_PRIVATE_KEY \
                --repo "$GITHUB_REPOSITORY" --env iq9075-release --app actions >/dev/null

  verify-homebrew:
    name: Verify target Homebrew authorization
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: homebrew-release
    steps:
      - name: Prove target token has push access
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$HOMEBREW_TAP_TOKEN" ] \
            || { echo "Homebrew target credential unavailable" >&2; exit 1; }
          can_push="$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" \
            gh api repos/plaid-ai/NUV-agent-homebrew --jq '.permissions.push')"
          [ "$can_push" = true ] \
            || { echo "Homebrew target credential lacks push access" >&2; exit 1; }

  verify-apt:
    name: Verify existing APT target material
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: apt-release
    steps:
      - name: Check out exact migration revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Prove APT signing and GCP credentials
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          python3 packaging/release/verify-secret-migration-material.py apt-gpg \
            --private-key-env APT_GPG_PRIVATE_KEY \
            --passphrase-env APT_GPG_PASSPHRASE \
            --policy packaging/release/release-security-policy.json
          python3 packaging/release/verify-secret-migration-material.py gcp-auth \
            --project-env GCP_PROJECT_ID --key-env GCP_SA_KEY

  verify-iq9075:
    name: Verify target IQ9075 material
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: iq9075-release
    steps:
      - name: Check out exact migration revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Prove IQ9075 signing and GCP credentials
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          IQ9075_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.IQ9075_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 packaging/release/verify-secret-migration-material.py gcp-auth \
            --project-env GCP_PROJECT_ID --key-env GCP_SA_KEY
          python3 packaging/release/verify-secret-migration-material.py iq-key \
            --private-key-env IQ9075_RELEASE_SIGNING_PRIVATE_KEY \
            --policy packaging/release/release-security-policy.json

  verify-face:
    name: Verify existing face-artifact target material
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: face-artifacts-release
    steps:
      - name: Check out exact migration revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned gcloud CLI
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Prove face-artifact GCP credentials
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          python3 packaging/release/verify-secret-migration-material.py gcp-auth \
            --project-env GCP_PROJECT_ID --key-env GCP_SA_KEY

  delete-repository-copies:
    name: Verify exact target metadata, then delete repository copies
    needs:
      - migrate
      - verify-homebrew
      - verify-apt
      - verify-iq9075
      - verify-face
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-secret-migration
    steps:
      - name: Check out exact migration revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck exact metadata and remove only the forbidden set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SECRET_MIGRATION_ADMIN_TOKEN }}
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [ "$GITHUB_SHA" = "$main_sha" ] && [ "$EXECUTING_WORKFLOW_SHA" = "$main_sha" ] \
            || { echo "protected main changed before repository-secret deletion" >&2; exit 1; }
          [ "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .protected)" = true ] \
            || { echo "main is not protected" >&2; exit 1; }
          [ "$(gh api user --jq .login)" = "$GITHUB_ACTOR" ] \
            || { echo "administrator token no longer belongs to workflow actor" >&2; exit 1; }
          assert_exact_names() {
            local environment_name="$1"
            local expected="$2"
            local actual
            actual="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/environments/${environment_name}/secrets?per_page=100" \
              --jq '.secrets[].name' | LC_ALL=C sort)"
            [ "$actual" = "$expected" ] \
              || { echo "target environment secret metadata differs from policy" >&2; exit 1; }
          }
          assert_exact_names homebrew-release 'HOMEBREW_TAP_TOKEN'
          assert_exact_names apt-release $'APT_GPG_PASSPHRASE\nAPT_GPG_PRIVATE_KEY\nGCP_PROJECT_ID\nGCP_SA_KEY'
          assert_exact_names iq9075-release $'GCP_PROJECT_ID\nGCP_SA_KEY\nIQ9075_RELEASE_SIGNING_PRIVATE_KEY'
          assert_exact_names face-artifacts-release $'GCP_PROJECT_ID\nGCP_SA_KEY'

          mapfile -t forbidden < <(jq -er '.forbiddenRepositorySecrets[]' \
            packaging/release/release-security-policy.json)
          [ "${#forbidden[@]}" -eq 8 ] \
            || { echo "forbidden repository-secret policy changed" >&2; exit 1; }
          before="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/secrets?per_page=100" \
            --jq '.secrets[].name' | LC_ALL=C sort)"
          for name in "${forbidden[@]}"; do
            grep -Fxq "$name" <<<"$before" \
              || { echo "forbidden repository-secret metadata changed before deletion" >&2; exit 1; }
          done
          for name in "${forbidden[@]}"; do
            deleted=false
            for _ in 1 2 3; do
              if gh secret delete "$name" \
                --repo "$GITHUB_REPOSITORY" --app actions >/dev/null 2>&1
              then
                deleted=true
                break
              fi
              sleep 1
            done
            [ "$deleted" = true ] \
              || { echo "repository-secret deletion failed after retries" >&2; exit 1; }
          done
          after="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/secrets?per_page=100" \
            --jq '.secrets[].name' | LC_ALL=C sort)"
          for name in "${forbidden[@]}"; do
            ! grep -Fxq "$name" <<<"$after" \
              || { echo "forbidden repository secret remains" >&2; exit 1; }
          done
