name: release-request

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-request-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  request:
    name: Test tag without release credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag as untrusted build input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate basic tag identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" ]
          [ "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA" ]
          [ -z "$(git status --porcelain --untracked-files=all)" ]

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run release gate without secrets
        env:
          VERSION: ${{ github.ref_name }}
          NUV_AGENT_CONFIG: ${{ runner.temp }}/nuv-agent-request-${{ github.run_id }}.env
        run: |
          set -euo pipefail
          python3 packaging/release/stamp-build-info.py \
            --sha "$GITHUB_SHA" --version "${VERSION#v}"
          python3 -m venv "${RUNNER_TEMP}/request-venv"
          "${RUNNER_TEMP}/request-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/request-venv/bin/python" -m pip install .
          "${RUNNER_TEMP}/request-venv/bin/python" -m pip install \
            transformers==5.16.1 huggingface-hub==1.29.0 hf-xet==1.6.0 \
            tokenizers==0.23.1 safetensors==0.8.0
          "${RUNNER_TEMP}/request-venv/bin/python" \
            packaging/release/run-isolated-tests.py
