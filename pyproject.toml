[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuv-agent"
version = "0.1.117"
description = "Nuvion on-device agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "python-dotenv",
  "pyserial",
  "qrcode",
  "websockets",
  "stomper",
  "aiohttp",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
zsad = [
  "torch>=2.1.0",
  "transformers>=4.40.0,<5.0.0",
  "Pillow>=10.0.0",
  "sentencepiece",
  "protobuf",
]
triton = [
  "tritonclient[http]",
  "opencv-python",
]
depthai = [
  "depthai==2.32.0.0",
]

[project.scripts]
nuv-agent = "nuvion_app.cli:main"
nuvion-updater = "nuvion_updater.daemon:main"

[tool.setuptools]
packages = [
  "nuvion_app",
  "nuvion_app.inference",
  "nuvion_app.agent",
  "nuvion_app.runtime",
  "nuvion_updater",
]
include-package-data = true

[tool.setuptools.package-data]
nuvion_app = ["config_template.env"]
